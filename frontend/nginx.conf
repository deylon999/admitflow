# Guests are free to create, so abuse limits have to be per client address here.
map $request_method $session_write_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $session_write_client zone=session_writes:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lookups:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=imports:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_req_status 429;
limit_conn_status 429;

# No addresses, paths or queries: paths contain private direction identifiers.
log_format private_safe '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log private_safe;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_conn connections 40;

    # Only a Docker-network proxy (Caddy in production) may state the client address.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":"Слишком много запросов. Подождите минуту и повторите."}';
    }

    # Operational endpoints stay inside the Docker network.
    location = /api/status { return 404; }
    location = /api/docs { return 404; }
    location = /api/openapi.json { return 404; }

    location = /api/v1/session {
        limit_req zone=session_writes burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /api/v1/import {
        client_max_body_size 8m;
        limit_req zone=imports burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location ~ ^/api/v1/sources/[^/]+/lookup$ {
        limit_req zone=lookups burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
