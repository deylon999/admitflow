<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdmitFlow catalog QA</title><style>body{font:16px system-ui;background:#f8faff;color:#10131f;margin:24px}h1{margin-bottom:8px}select{padding:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:24px}.card{background:white;border:1px solid #e6eaf4;border-radius:16px;padding:18px}.card img{width:100%;height:auto}.card a{color:#2147ff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>AdmitFlow: verified catalog</h1><p>Four live React pages, real FastAPI, reviewed archive-2026 metadata. All widths have zero horizontal overflow.</p><label>Viewport <select id="width"><option>390</option><option>768</option><option>1024</option><option>1280</option><option selected>1440</option></select> px</label><div class="grid" id="screens"></div><script>const names={universities:'University catalog',university:'University detail',programs:'Program catalog',program:'Program detail'};function render(){const width=document.getElementById('width').value;document.getElementById('screens').innerHTML=Object.entries(names).map(([slug,name])=>`<section class="card"><h2>${name}</h2><a href="${width}/${slug}.png"><img src="${width}/${slug}.png" alt="${name} at ${width} pixels"></a></section>`).join('')}document.getElementById('width').onchange=render;render();</script></html>
