ge-analytics", "/faq", "/how-it-works", "/not-found", "/programs", "/programs/mtuci-se", "/universities", "/universities/mtuci"];const route=document.querySelector('#route'),width=document.querySelector('#width'),overlay=document.querySelector('#overlay'),opacity=document.querySelector('#opacity'),pair=document.querySelector('#pair');for(const r of routes){const o=document.createElement('option');o.value=r;o.textContent=r;route.append(o)}route.value='/';function update(){const slug=route.value==='/'?'landing':route.value.slice(1).replaceAll('/','__');document.querySelector('#original').src=width.value+'/'+slug+'-original.png';document.querySelector('#copy').src=width.value+'/'+slug+'-copy.png';pair.classList.toggle('overlay',overlay.checked);pair.lastElementChild.style.opacity=overlay.checked?opacity.value/100:1}for(const el of[route,width,overlay,opacity])el.addEventListener('input',update);update();</script></html>
