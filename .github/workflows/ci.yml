name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm test
      - run: npm run build
      - run: python -m pytest -q
        working-directory: backend
      - run: python ../scripts/roadmap.py --check
      - run: npx playwright install --with-deps chromium
      - name: Start test API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/abiturient-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/abiturient-api.log
          exit 1
      - run: npm run test:e2e
        env:
          E2E_API: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
          retention-days: 7
