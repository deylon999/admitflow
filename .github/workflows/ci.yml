name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/stop-child.test.mjs
      - name: Frontend tests
        shell: bash
        run: |
          mkdir -p test-results
          npm test 2>&1 | tee test-results/frontend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-tests
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: error
      # Live pixel comparison needs the sibling source checkout. Run locally
      # with npm run test:visual; OS-dependent font baselines are not used in CI.
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admitflow_test
          POSTGRES_USER: admitflow
          POSTGRES_PASSWORD: admitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admitflow -d admitflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --require-postgres --junitxml=test-results/backend.xml
        env:
          TEST_DATABASE_URL: postgresql+psycopg://admitflow:admitflow@localhost:5432/admitflow_test
      # Repository tools: roadmap consistency and the weekly report generator (PDF included).
      - run: python -m pip install -r scripts/requirements-dev.txt
        working-directory: .
      - run: python -m unittest scripts.tests.test_roadmap scripts.tests.test_weekly_report
        working-directory: .
      - run: python scripts/roadmap.py --check
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: backend/test-results/backend.xml
