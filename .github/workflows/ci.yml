name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admitflow_test
          POSTGRES_USER: admitflow
          POSTGRES_PASSWORD: admitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admitflow -d admitflow_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm test
      - run: npm run build
      - run: python -m pytest -q --require-postgres --junitxml=test-results/backend.xml
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://admitflow:admitflow@localhost:5432/admitflow_test
      - run: python ../scripts/roadmap.py --check
      - run: npx playwright install --with-deps chromium
      - name: Start test API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/abiturient-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/abiturient-api.log
          exit 1
      - run: npm run test:e2e -- --project=chromium
        env:
          E2E_API: '1'
          E2E_SERVER: preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failure
          path: |
            frontend/test-results/
            backend/test-results/backend.xml
          retention-days: 7

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            install: firefox
          - project: webkit
            install: webkit
          - project: mobile-chromium
            install: chromium
          - project: mobile-webkit
            install: webkit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Start test API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/abiturient-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/abiturient-api.log
          exit 1
      - run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=line
        env:
          E2E_API: '1'
          E2E_SERVER: preview

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: docker build -t admitflow-backend:ci -f backend/Dockerfile .
      - run: docker build -t admitflow-frontend:ci -f frontend/Dockerfile .
      - run: python scripts/rehearse_compose.py --backend-image admitflow-backend:ci --frontend-image admitflow-frontend:ci --output /tmp/compose-report.json
      - run: cat /tmp/compose-report.json
        if: always()
